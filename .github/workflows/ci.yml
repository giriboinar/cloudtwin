# -----------------------------------------------------------------------------
# CloudTwin — Continuous Integration
#
# Triggers: push + pull_request to main.
#
# Jobs:
#   1. test      — pytest over the backend test suite
#   2. sonarqube  — static analysis, OPTIONAL (runs only when SONAR_TOKEN exists
#                   and never fails the build)
#   3. build      — docker build of the backend image, tagged with the git SHA;
#                   image is saved to an artifact so later jobs reuse the exact
#                   same image that was tested/scanned
#   4. trivy      — vulnerability scan of the built image for HIGH/CRITICAL,
#                   failing the build only on CRITICAL findings
#   5. push       — on main-branch pushes only: OIDC-authenticated push to ECR
#                   with :sha and :latest tags
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: cloudtwin-backend
  AWS_REGION: ap-south-1 # change to your region

jobs:
  # --- 1. Unit tests -------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r app/backend/requirements.txt

      - name: Run pytest
        run: pytest app/backend/tests

  # --- 2. SonarQube (OPTIONAL) ----------------------------------------------
  # This job only runs when the SONAR_TOKEN secret is configured, and
  # continue-on-error: true means a SonarQube failure (or a misconfigured
  # SonarQube server) can never block the pipeline. Delete this job entirely
  # if you do not use SonarQube.
  sonarqube:
    name: SonarQube scan (optional)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.SONAR_TOKEN != '' }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate blame data

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # --- 3. Build Docker image -------------------------------------------------
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image tagged with git SHA
        run: |
          docker build -f docker/Dockerfile.backend \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -o /tmp/backend-image.tar

      - name: Upload image artifact for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          retention-days: 1

  # --- 4. Trivy vulnerability scan --------------------------------------------
  # Scans the exact image built in the previous job. HIGH findings are
  # reported; CRITICAL findings fail the build.
  trivy:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/backend-image.tar

      - name: Scan for HIGH/CRITICAL (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"

  # --- 5. Push to ECR (main branch only) ---------------------------------------
  # Authenticates to AWS with OIDC (aws-actions/configure-aws-credentials) —
  # no long-lived AWS access keys are stored as secrets. The workflow's IAM
  # role is assumed via secrets.AWS_ROLE_ARN (see ci-cd/README.md).
  push:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [build, trivy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write # required for OIDC federation with AWS
      contents: read
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/backend-image.tar

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push :sha and :latest
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="${{ secrets.ECR_REPOSITORY }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} "$REGISTRY/$REPO:${{ github.sha }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} "$REGISTRY/$REPO:latest"
          docker push "$REGISTRY/$REPO:${{ github.sha }}"
          docker push "$REGISTRY/$REPO:latest"
