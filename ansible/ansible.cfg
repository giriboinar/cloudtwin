[defaults]
# Path to the default inventory, relative to this config file.
inventory = inventory/hosts.yml

# SSH host-key checking is disabled for convenience in a portfolio/demo
# setup. PIN host keys (known_hosts) in production instead.
host_key_checking = False

# Don't leave .retry files behind after a failed run.
retry_files_enabled = False
retry_files_save_path = ~/.ansible.d/retries

# Friendlier, diff-style output.
stdout_callback = yaml

# Keep the forks modest for a single t3.micro target.
forks = 10

# Ansible facts are needed by some plays (package manager detection, etc.).
gathering = smart

[privilege_escalation]
# Default escalation method when a task sets become: true.
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Reuse SSH connections for speed.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
