---
# CloudTwin example inventory.
# ALL VALUES BELOW ARE PLACEHOLDERS. Replace them with your real
# EC2 instance details before running any playbook.

all:
  children:
    app_servers:
      hosts:
        # The single app server created by the CloudTwin Terraform layer.
        cloudtwin-app-1:
          # PLACEHOLDER: public IPv4 (or DNS) of the t3.micro EC2 instance,
          # e.g. the value of the terraform output `cloudtwin_app_public_ip`.
          ansible_host: "<EC2_PUBLIC_IP>"

          # Amazon Linux 2023 default SSH user.
          ansible_user: "ec2-user"

          # PLACEHOLDER: path to the private key matching the EC2 key pair
          # given to Terraform (variable `ssh_key_name`). Permissions must
          # be 600 (chmod 600 ~/.ssh/cloudtwin.pem).
          ansible_ssh_private_key_file: "~/.ssh/cloudtwin.pem"

          # Port is 22 by default; included here so it is easy to override.
          ansible_port: 22

      vars:
        # Group-level overrides for the app servers.
        # Example: switch the deploy user or timezone in one place.
        # deploy_user: "deploy"
        # app_timezone: "Asia/Kolkata"
        # app_dir: "/opt/cloudtwin"
