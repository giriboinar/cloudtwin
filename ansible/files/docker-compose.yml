# CloudTwin application stack (deployed to /opt/cloudtwin by Ansible).
# NOTE: `cloudtwin/api` is a placeholder image name — replace it with the
# real registry image built from this project's application code.

services:
  api:
    image: cloudtwin/api:latest
    container_name: cloudtwin-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    container_name: cloudtwin-prometheus
    ports:
      - "9090:9090"
    volumes:
      - /opt/cloudtwin/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
