# CloudTwin — nginx config for the frontend service.
# Lives at <repo-root>/docker/nginx.conf; copied to /etc/nginx/conf.d/default.conf
# by Dockerfile.frontend.
#
# - Serves the static SPA from /usr/share/nginx/html.
# - Proxies /api/ to the backend (app.js uses RELATIVE /api/... paths).
#   Both `location /api/` and the proxy_pass target carry a trailing slash,
#   so /api/health on nginx becomes /health on the backend (prefix stripped).
# - /health and /metrics proxy straight through as convenience aliases.
#
# Upstream host `api` resolves via Docker Compose's embedded DNS to the
# `api` service container.

upstream api_backend {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static files: SPA fallback so client-side routes still load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy. Trailing slashes on BOTH sides strip the /api/
    # prefix: /api/users -> http://api:8000/users
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Convenience: hit the backend directly through the frontend origin.
    location /health {
        proxy_pass http://api_backend/health;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://api_backend/metrics;
        proxy_set_header Host $host;
    }
}
