apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudtwin-api
  namespace: cloudtwin
  labels:
    app.kubernetes.io/name: cloudtwin
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cloudtwin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudtwin-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
