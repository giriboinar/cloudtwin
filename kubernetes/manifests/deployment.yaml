apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudtwin-api
  namespace: cloudtwin
  labels:
    app.kubernetes.io/name: cloudtwin
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cloudtwin
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudtwin
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudtwin
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: cloudtwin
    spec:
      containers:
        - name: cloudtwin-api
          # Replace <ECR_URL> with your real ECR registry, e.g.
          # 123456789012.dkr.ecr.ap-south-1.amazonaws.com/cloudtwin-api:latest
          image: <ECR_URL>/cloudtwin-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cloudtwin-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudtwin-secrets
                  key: DATABASE_URL
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: cloudtwin-config
                  key: APP_ENV
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
