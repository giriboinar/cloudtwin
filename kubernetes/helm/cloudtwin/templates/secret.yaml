apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudtwin.fullname" . }}-secrets
  labels:
    {{- include "cloudtwin.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Placeholder only — override at install time, e.g.
  # --set secrets.databaseUrl="postgresql://user:pass@host/db"
  # Never commit a real connection string here.
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
